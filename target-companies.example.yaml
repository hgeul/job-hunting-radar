# 감시 대상 기업 목록 템플릿 (Target Radar)
#
# 이 파일을 target-companies.yaml 로 복사한 뒤 실제 기업으로 채우세요.
#   cp target-companies.example.yaml target-companies.yaml
# 실파일은 .gitignore 됩니다. 어느 회사를 노리는지도 개인정보입니다.
# 공개 템플릿에는 가상 회사만 넣습니다(커밋 게이트는 파일명만 보므로 내용은 사람이 확인).
#
# JSON 으로 쓰고 싶으면 target-companies.example.json 을 쓰세요. 스키마는 같습니다.
# YAML 을 쓰려면 PyYAML 이 필요합니다(pip install pyyaml).
#
# 권장 규모: S tier 8~12곳, A tier 15~20곳, B tier 10~20곳. 합계 30~50곳.
# (실제 목록은 target-companies.yaml 에 두세요. 이 파일은 형식 예시입니다.)

version: 1

# 아래 3개 블록은 사람이 읽는 메모입니다. 코드는 보존만 하고 아직 쓰지 않습니다.
generated_at: '2026-01-01'
purpose: Job Hunting Radar target company registry
profile_assumption:
  primary_role:
    - Backend Engineer
  career_years_reference: 4
  preferred_regions:
    - Seoul
  note: 법적 기업규모 판정표가 아니라 개인 이직 Target Registry 다.

defaults:
  # Recommendation 등급별 알림 정책. Phase 6~7 에서 소비 예정.
  notify_recommendations:
    - STRONG_APPLY
    - APPLY
  review_recommendations:
    - REVIEW

  # 전 회사 공통 직무 필터. 회사가 자기 roles 를 쓰면 그 회사만 이걸 덮어쓴다.
  # 목록을 회사마다 복제하지 마세요. 한 줄 고칠 때 전부 고쳐야 합니다.
  #
  # 비교 전에 공백·하이픈·언더바를 지우고 소문자화합니다. 그래서
  # "Back-end" 와 "backend", "서버_백엔드" 와 "백엔드" 가 같이 잡힙니다.
  # 한글 표기를 꼭 같이 넣으세요. 국내 공고 제목 다수가 한글이라
  # 영문만 넣으면 대부분이 조용히 탈락합니다.
  roles:
    include:
      - backend
      - server
      - engineer
      - developer
      - 백엔드
      - 서버
      - 개발자
      - 엔지니어
      - 플랫폼
      - 인프라
    exclude:
      # 짧은 조각을 쓰지 마세요. 'md' 는 'MDM'·'ALM Developer' 에 걸리고
      # 'ios' 는 'studios' 에 걸립니다. 구체적인 말로 쓰세요.
      - 프론트엔드
      - frontend
      - 안드로이드
      - ios 개발
      - qa 엔지니어
      - 디자이너
      - 마케팅

companies:
  # ---------------------------------------------------------------------
  # 필수: id, name
  # 사실상 필수: aliases (공고에 뜨는 표기를 전부. 없으면 못 잡습니다)
  # ---------------------------------------------------------------------
  - id: example-alpha              # 소문자·숫자·하이픈. 한 번 정하면 바꾸지 마세요
    name: 예시알파
    aliases:
      - Example Alpha
      - 예시알파(주)
      - Example Alpha Inc.
    tier: S                        # S | A | B | C. 점수엔 안 섞고 알림 우선순위에만
    enabled: true
    priority: 100                  # 같은 tier 안에서의 순서(정수)

    # 공식 채용페이지. Phase 4 어댑터가 여기서 수집합니다.
    careers_url: https://careers.example-alpha.invalid/

    # 공통 ATS 또는 그룹 포털 식별자. **같은 값을 쓰는 회사는 어댑터 하나로 함께 커버합니다.**
    # 감시 대상이 수십 곳이어도 그 수만큼 크롤러를 만들지 않는 것이 요점입니다.
    platform_family: example_alpha_careers

    # 이 URL 을 실제로 확인했는지에 대한 메모. 자유 문자열이라 검증하지 않습니다.
    verification: verified

    # 수집 전략 상태. 코드가 이 값을 보고 자동 수집을 시도할지 판단합니다.
    #   generic_adapter_priority     공통 ATS. 범용 어댑터를 먼저 만든다
    #   adapter_candidate            공개 목록이 있어 바로 collector 후보
    #   dynamic_research_needed      JS 렌더링 많음. endpoint 조사 먼저
    #   restricted_research_needed   자동 접근 제한 가능. 우회부터 만들지 않는다
    #   group_portal_research_needed 그룹 통합 포털. source_filter 로 분리
    #   job_endpoint_research_needed 공고 목록 endpoint 를 더 확인해야 함
    # 앞의 두 개만 "지금 수집 시도 가능"으로 취급합니다.
    collection_status: adapter_candidate

    # roles 를 생략하면 위 defaults.roles 를 물려받습니다.
    # 이 회사만 다르게 볼 때에만 씁니다(쓰면 defaults 를 통째로 덮어씁니다).
    roles:
      include:
        - backend
        - 백엔드
        - 서버
        - java
        - platform
      exclude:
        - 프론트엔드
        - QA 엔지니어
        - 디자이너
    notes: 회사별 roles 로 defaults 를 덮어쓰는 예시.

  # ---------------------------------------------------------------------
  # 계열사는 반드시 따로 등록합니다.
  # 회사명은 완전일치로 비교하므로 '예시알파'와 '예시알파 클라우드'는 별개입니다.
  # 그룹 포털을 공유하면 careers_url·platform_family 를 같게 두고
  # source_filter 로 자기 공고만 골라냅니다.
  # ---------------------------------------------------------------------
  - id: example-alpha-cloud
    name: 예시알파 클라우드
    aliases:
      - Example Alpha Cloud
    tier: A
    enabled: true
    priority: 90
    careers_url: https://careers.example-alpha.invalid/
    platform_family: example_alpha_careers
    verification: verified_shared_portal
    collection_status: group_portal_research_needed
    source_filter:
      company: 예시알파 클라우드
    roles:
      include:
        - backend
        - cloud
        - infra
      exclude:
        - 디자이너
    notes: 같은 포털을 쓰는 계열사 예시.

  # ---------------------------------------------------------------------
  # enabled: false 로 두면 감시하지 않되 목록에서 지우지는 않습니다.
  # 꺼둔 회사의 alias 도 충돌 검사에는 계속 참여합니다(다시 켤 때 안전).
  # ---------------------------------------------------------------------
  - id: example-beta
    name: 예시베타
    aliases:
      - Example Beta
      - 주식회사 예시베타
    tier: B
    enabled: false
    priority: 50
    careers_url: https://careers.example-beta.invalid/
    platform_family: example_ats
    verification: verified
    collection_status: generic_adapter_priority
    # roles 없음 = 위 defaults.roles 를 그대로 물려받습니다(권장).
    notes: 잠시 꺼둔 예시. roles 를 생략해 defaults 를 상속하는 형태.
